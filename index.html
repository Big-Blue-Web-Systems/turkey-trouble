<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turkey Trouble</title>
  <link rel="icon" href="assets/turkey-tile.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/turkey-tile.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <header class="top-bar">
      <div class="brand-block">
        <h1 class="brand">
          <img
            class="brand-logo"
            src="assets/turkey-trouble-logo.png"
            alt="Turkey Trouble"
            width="640"
            height="200"
          />
        </h1>
        <p class="tagline">Test your aim and bag the cash, but don't shoot at Turkey Tom....</p>
      </div>
    </header>

    <section id="setup-panel" class="setup-panel">
      <div class="setup-actions">
        <button id="btn-add-players" class="btn btn-players" type="button">Add Players</button>
        <div class="rounds-picker" id="rounds-picker">
          <span class="rounds-picker-label">Rounds</span>
          <div class="rounds-control">
            <button
              type="button"
              id="rounds-trigger"
              class="rounds-trigger"
              aria-label="Number of rounds"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="rounds-menu"
            >
              <span id="rounds-trigger-value">1</span>
              <span class="rounds-caret" aria-hidden="true"></span>
            </button>
            <ul id="rounds-menu" class="rounds-menu" role="listbox" hidden>
              <li role="option" tabindex="-1" data-value="1" aria-selected="true">1</li>
              <li role="option" tabindex="-1" data-value="3" aria-selected="false">3</li>
              <li role="option" tabindex="-1" data-value="5" aria-selected="false">5</li>
            </ul>
          </div>
        </div>
        <label class="capture-mode-toggle" for="capture-video-toggle">
          <input
            id="capture-video-toggle"
            type="checkbox"
            role="switch"
            aria-checked="false"
          />
          <span class="capture-mode-switch" aria-hidden="true">
            <span class="capture-mode-knob"></span>
          </span>
          <span class="capture-mode-text">Video Reaction</span>
        </label>
        <button id="btn-done-players" class="btn btn-start-game" type="button" hidden>Done</button>
      </div>
      <div id="players-editor" class="players-editor" hidden>
        <form id="add-player-form" class="add-player-form">
          <input id="player-name-input" type="text" maxlength="24" placeholder="Player name" autocomplete="off" />
          <button type="submit" class="btn btn-add" id="btn-add-name">Add</button>
        </form>
        <p class="drag-hint">Drag to set turn order</p>
        <ul id="player-list" class="player-list" aria-label="Player order"></ul>
        <button id="btn-start-from-setup" class="btn btn-start-from-setup" type="button">Start Game</button>
      </div>
    </section>

    <div id="turn-hud" class="turn-hud" hidden>
      <div class="scoreboard" id="scoreboard" aria-live="polite">
        <span id="round-label" class="round-label" hidden>Round #1</span>
        <div class="scoreboard-line">
          <span class="score-label" id="score-label">Turn</span>
          <span id="score" class="score-value">$0</span>
        </div>
      </div>
    </div>

    <div class="board-row">
      <aside class="reactions-panel" aria-label="Reaction photos">
        <button
          type="button"
          id="reactions-prev"
          class="reactions-nav reactions-nav-prev"
          aria-label="Previous reaction"
        >
          ▲
        </button>
        <div class="reactions-stack-wrap">
          <div id="reaction-strip" class="reactions-stack"></div>
        </div>
        <button
          type="button"
          id="reactions-next"
          class="reactions-nav reactions-nav-next"
          aria-label="Next reaction"
        >
          ▼
        </button>
      </aside>

      <div class="board-column">
        <div class="board-frame">
          <div id="board-lights" class="board-lights" aria-hidden="true"></div>
          <main class="board" id="board" aria-label="Prize board">
            <div class="camera-well">
              <video id="camera" autoplay playsinline muted></video>
              <canvas id="capture" hidden></canvas>
              <img
                class="camera-border"
                src="assets/camera-border.png"
                alt=""
                aria-hidden="true"
              />
              <div id="turkey-blast" class="turkey-blast" hidden aria-hidden="true">
                <video
                  id="fire-video"
                  class="overlay-video"
                  src="assets/turkey-trouble-fire.mp4"
                  playsinline
                  preload="auto"
                ></video>
                <video
                  id="bust-video"
                  class="overlay-video"
                  src="assets/turkey-bangers.mp4"
                  playsinline
                  preload="auto"
                ></video>
              </div>
              <div id="camera-status" class="camera-status">Starting camera…</div>
              <div id="fire-hit" class="fire-hit" hidden aria-hidden="true"></div>
              <div id="reaction-flash" class="reaction-flash" hidden aria-hidden="true">
                <img id="reaction-flash-image" class="reaction-flash-image" alt="Latest reaction" />
              </div>
              <div id="result-banner" class="result-banner" hidden></div>
            </div>
          </main>
        </div>

        <section id="controls" class="controls">
          <button id="btn-action" class="btn btn-action is-start" type="button">Pull!</button>
          <button id="btn-bank" class="btn btn-bank is-slot-hidden" type="button" disabled>Bag Cash</button>
          <p id="solo-warning" class="solo-warning" hidden>
            You're about to start a single player game. Press <strong class="solo-pull">Pull!</strong> again to begin.
          </p>
        </section>
      </div>

      <aside id="leaderboard" class="leaderboard" aria-label="Scoreboard">
        <h2 class="leaderboard-title">Scoreboard</h2>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>
        <p id="leaderboard-empty" class="leaderboard-empty">Waiting for players…</p>
      </aside>
    </div>
  </div>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-modal-ignore></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-subtitle" class="modal-subtitle"></p>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="preview-modal" class="preview-modal" hidden>
    <div class="preview-backdrop" id="preview-backdrop"></div>
    <div class="preview-dialog" role="dialog" aria-modal="true" aria-label="Reaction preview">
      <button id="preview-close" class="preview-close" type="button" aria-label="Close preview">×</button>
      <div class="preview-frame">
        <img id="preview-image" class="preview-image" alt="Reaction preview" />
        <button id="preview-download" class="dl-circle" type="button" aria-label="Download reaction">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42L11 13.59V4a1 1 0 0 1 1-1Zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
